services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-prompt-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=data/audio_prompt_engine.db
      - HF_HOME=/home/appuser/.cache/huggingface
    volumes:
      - ./data:/app/data
      - hf_cache:/home/appuser/.cache/huggingface

volumes:
  hf_cache:
    name: audio_prompt_engine_hf_cache
